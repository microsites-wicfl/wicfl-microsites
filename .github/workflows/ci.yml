name: Validate and build

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/template/**"
      - "packages/config-schema/**"
      - "scripts/**"
      - "sites/**"
      - "apps/studio/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/template/**"
      - "packages/config-schema/**"
      - "scripts/**"
      - "sites/**"
      - "apps/studio/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  studio-tests:
    name: Test WICFL Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix apps/studio

  validate:
    name: Validate all site configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  discover-sites:
    name: Discover sites to build
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/changed-sites.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build-sites:
    name: Build ${{ matrix.site }}
    needs: discover-sites
    # Changes that touch no site (for example only apps/studio) produce an empty matrix, and an
    # empty matrix fails the whole run even though every job passed. Skip the job instead.
    if: needs.discover-sites.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-sites.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site -- ${{ matrix.site }}

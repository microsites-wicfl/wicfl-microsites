name: Deploy Stuart Homeowners demo

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy demo Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site -- stuart-homeowners
      - name: Deploy to Cloudflare Workers (preview subdomain only, no custom domain route)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.stuart-homeowners.toml

name: Deploy WICFL Lead API

on:
  push:
    branches: [main]
    paths:
      - "apps/lead-api/**"
      - ".github/workflows/deploy-lead-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test apps/lead-api/test/*.test.mjs
      - name: Set Lead API secrets
        env:
          LEAD_API_GHL_API_TOKEN: ${{ secrets.LEAD_API_GHL_API_TOKEN }}
          LEAD_API_GHL_LOCATION_ID: ${{ secrets.LEAD_API_GHL_LOCATION_ID }}
          LEAD_API_R2_ACCOUNT_ID: ${{ secrets.LEAD_API_R2_ACCOUNT_ID }}
          LEAD_API_R2_BUCKET_NAME: ${{ secrets.LEAD_API_R2_BUCKET_NAME }}
          LEAD_API_R2_ACCESS_KEY_ID: ${{ secrets.LEAD_API_R2_ACCESS_KEY_ID }}
          LEAD_API_R2_SECRET_ACCESS_KEY: ${{ secrets.LEAD_API_R2_SECRET_ACCESS_KEY }}
        run: |
          printf '%s' "$LEAD_API_GHL_API_TOKEN" | npx wrangler secret put GHL_API_TOKEN --config apps/lead-api/wrangler.jsonc
          printf '%s' "$LEAD_API_GHL_LOCATION_ID" | npx wrangler secret put GHL_LOCATION_ID --config apps/lead-api/wrangler.jsonc
          printf '%s' "$LEAD_API_R2_ACCOUNT_ID" | npx wrangler secret put R2_ACCOUNT_ID --config apps/lead-api/wrangler.jsonc
          printf '%s' "$LEAD_API_R2_BUCKET_NAME" | npx wrangler secret put R2_BUCKET_NAME --config apps/lead-api/wrangler.jsonc
          printf '%s' "$LEAD_API_R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID --config apps/lead-api/wrangler.jsonc
          printf '%s' "$LEAD_API_R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY --config apps/lead-api/wrangler.jsonc
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/lead-api/wrangler.jsonc
      - name: Record URL
        run: echo "https://wicfl-lead-api.wicfl-microsites.workers.dev" >> "$GITHUB_STEP_SUMMARY"

name: Deploy WICFL Studio

on:
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
      - ".github/workflows/deploy-studio.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix apps/studio
      - name: Set Studio runtime secrets when available
        env:
          STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN }}
          STUDIO_ALLOWED_EMAILS: ${{ secrets.STUDIO_ALLOWED_EMAILS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$STUDIO_GITHUB_TOKEN" ]; then
            printf '%s' "$STUDIO_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config apps/studio/wrangler.jsonc
          else
            echo "Studio deployed without credentials: missing secret STUDIO_GITHUB_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$STUDIO_ALLOWED_EMAILS" ]; then
            printf '%s' "$STUDIO_ALLOWED_EMAILS" | npx wrangler secret put ALLOWED_EMAILS --config apps/studio/wrangler.jsonc
          else
            echo "Studio deployed without credentials: missing secret STUDIO_ALLOWED_EMAILS" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/studio/wrangler.jsonc
      - name: Record URL
        run: echo "https://wicfl-studio.wicfl-microsites.workers.dev" >> "$GITHUB_STEP_SUMMARY"

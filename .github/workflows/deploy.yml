name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "packages/template/**"
      - "sites/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Disabled until W-092 provisions Cloudflare
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # W-103: schema validation checks shape, not readiness. This second gate rejects known
      # placeholder patterns (fake license number, unprovisioned analytics IDs, a tracking phone
      # nobody set up) in the built config before it can reach a real production deploy. It is
      # exempt for sites/_* fixtures by the script itself, which is all "_example" is right now.
      # TODO(W-014): once the real site/Worker matrix exists, this needs to check the actual
      # site being deployed instead of the hardcoded "_example" placeholder below.
      - name: Check production readiness (W-103)
        run: node scripts/check-production-config.mjs _example
      # Enable only after W-092/W-010. Required repository secrets:
      # CLOUDFLARE_API_TOKEN: scoped Workers deployment token, never the Global API Key.
      # CLOUDFLARE_ACCOUNT_ID: WICFL Cloudflare account ID.
      # The Worker name, route and pod mapping are supplied by the provisioning work.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml

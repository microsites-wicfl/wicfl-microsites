name: Cloudflare smoke test (manual, disposable)

# One-off, manual-only workflow to confirm CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID authenticate correctly against Cloudflare, per the
# checklist in docs/SETUP.md ("Run one preview deploy ... with a non-production
# fixture before relying on the flow"). It deploys the _example fixture to a
# clearly-named, disposable Worker. It does not touch deploy.yml or
# preview.yml, which stay disabled until W-014 defines the real Worker/pod
# configuration. Safe to delete (along with wrangler.smoke-test.toml) once the
# credentials are confirmed working.

on:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Deploy _example fixture as a disposable test Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy disposable smoke-test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.smoke-test.toml

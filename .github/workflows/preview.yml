name: Preview deploy

# W-098: Pavel writes markdown for three weeks (21 Sep - 9 Oct) with no other way to see it
# rendered. Push a branch, get a URL in a PR comment, no local dev server or terminal required.

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/template/**"
      - "packages/config-schema/**"
      - "scripts/**"
      - "sites/**"
      - ".github/workflows/preview.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  discover-sites:
    name: Discover sites to preview
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/changed-sites.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview ${{ matrix.site }}
    needs: discover-sites
    # An empty matrix fails the whole run; skip when the change touches no site.
    if: needs.discover-sites.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-sites.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:site -- ${{ matrix.site }}
      # No W-103 production-readiness check here on purpose: a preview build legitimately
      # carries placeholder data while accounts are still being provisioned. That gate belongs
      # only in front of the real production deploy (see deploy.yml).
      - name: Deploy preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER_NAME="wicfl-pr${{ github.event.pull_request.number }}-${{ matrix.site }}"
          echo "worker_name=$WORKER_NAME" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --name "$WORKER_NAME" --assets "dist/sites/${{ matrix.site }}" --compatibility-date "2026-09-04"
      - name: Comment the preview URL on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const site = "${{ matrix.site }}";
            const workerName = "${{ steps.deploy.outputs.worker_name }}";
            // Account subdomain confirmed 2026-09-03 when the Cloudflare pipeline was first
            // verified end to end (Manage Account -> Account details -> Workers subdomain).
            const url = `https://${workerName}.wicfl-microsites.workers.dev`;
            const marker = `<!-- wicfl-preview:${site} -->`;
            const body = `${marker}\n**Preview for \`${site}\`:** ${url}\n\n_Updates automatically on every push to this branch. Deleted automatically when this PR closes._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
